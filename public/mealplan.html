<!DOCTYPE html>
<html>

<head>
    <title>Meal Plan - FitFeast</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="page-header">

    <h1 style="font-family: Georgia, 'Times New Roman', serif; font-weight: 600; letter-spacing: -0.03em;">
    Meal Plan
</h1>

        <p>
            Personalized meal recommendations based on your goal
            and daily calorie target.
        </p>

        <a href="/dashboard.html">
            ← Back to Dashboard
        </a>

    </div>

    <div class="meal-plan-summary">

        <div class="summary-card">
            <h3>Fitness Goal</h3>
            <p id="goal">Loading...</p>
        </div>

        <div class="summary-card">
            <h3>Daily Calorie Target</h3>
            <p id="calorieTarget">Loading...</p>
        </div>

    </div>


    <h2>Breakfast</h2>

    <div id="breakfast" class="meal-plan-options">
        Loading...
    </div>


    <h2>Lunch</h2>

    <div id="lunch" class="meal-plan-options">
        Loading...
    </div>


    <h2>Snack</h2>

    <div id="snack" class="meal-plan-options    ">
        Loading...
    </div>


    <h2>Dinner</h2>

    <div id="dinner" class="meal-plan-options">
        Loading...
    </div>


    <script src="js/mealplan.js"></script>

</body>

</html>
