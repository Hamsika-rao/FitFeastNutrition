<!DOCTYPE html>
<html>
<head>
    <title>Register - FitFeast</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>FitFeast</h1>

            <p class="auth-subtitle">
                Create your account to get started.
            </p>

            <form id="registerForm">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="5"
                    maxlength="40"
                    required
                >

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="1"
                    required
                >

                <label for="weight">
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    step="0.1"
                    min="1"
                    required
                >

                <label for="height">
                    Height (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    step="0.1"
                    min="1"
                    required
                >

                <label for="goal">
                    Fitness Goal
                </label>

                <select id="goal" required>

                    <option value="">
                        Select your goal
                    </option>

                    <option value="Weight Loss">
                        Weight Loss
                    </option>

                    <option value="Weight Gain">
                        Weight Gain
                    </option>

                    <option value="Maintain Weight">
                        Maintain Weight
                    </option>

                </select>

                <button type="submit">
                    Create Account
                </button>

            </form>

            <p id="message" class="auth-message"></p>

            <p class="auth-link">
                Already have an account?
                <a href="/login.html">Login here</a>
            </p>

        </div>

    </div>

    <script src="js/register.js"></script>

</body>
</html>
