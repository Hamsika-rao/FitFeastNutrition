<!DOCTYPE html>
<html>
<head>
    <title>Login - FitFeast</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>FitFeast</h1>

            <p class="auth-subtitle">
                Welcome back! Login to continue.
            </p>

            <form id="loginForm">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    minlength="5"
                    maxlength="40"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message" class="auth-message"></p>

            <p class="auth-link">
                Don't have an account?
                <a href="/register.html">Register here</a>
            </p>

        </div>

    </div>

    <script src="js/login.js"></script>

</body>
</html>
