<!DOCTYPE html>
<html>
<head>
    <title>Edit Profile - FitFeast</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <h1>Edit Profile</h1>

            <p class="auth-subtitle">
                Update your personal and fitness details.
            </p>

            <form id="editProfileForm">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    required
                >

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    required
                >

                <label for="age">
                    Age
                </label>

                <input
                    type="number"
                    id="age"
                    min="1"
                    required
                >

                <label for="height">
                    Height (cm)
                </label>

                <input
                    type="number"
                    id="height"
                    step="0.1"
                    min="1"
                    required
                >

                <label for="weight">
                    Weight (kg)
                </label>

                <input
                    type="number"
                    id="weight"
                    step="0.1"
                    min="1"
                    required
                >

                <label for="goal">
                    Fitness Goal
                </label>

                <select id="goal" required>

                    <option value="Weight Loss">
                        Weight Loss
                    </option>

                    <option value="Weight Gain">
                        Weight Gain
                    </option>

                    <option value="Maintain Weight">
                        Maintain Weight
                    </option>

                </select>

                <button type="submit">
                    Update Profile
                </button>

            </form>

            <p id="profileMessage" class="progress-message"></p>

            <p class="auth-link">
                <a href="/dashboard.html">
                    Back to Dashboard
                </a>
            </p>

        </div>

    </div>

    <script src="js/edit-profile.js"></script>

</body>
</html>
